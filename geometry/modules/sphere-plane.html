<header class="topbar"><div class="titleline"><div><div class="chapter">Ⅱ. 공간도형과 공간좌표 · 6. 구의 방정식</div><h1>구와 평면의 교차 시뮬레이터</h1></div><div class="actions"><button class="btn" id="homeBtn">처음으로</button><button class="btn" id="resetBtn">초기화</button><button class="btn warn" id="newBtn">새 활동</button><button class="btn" id="helpBtn">도움말</button></div></div><div class="modebar"><button class="btn active" data-mode="free">자유 탐색</button><button class="btn" data-mode="mission">미션 활동</button></div></header>

<div class="grid"><section class="card stage-card"><div class="stage-wrap" style="min-height:470px"><canvas id="scene" aria-label="구와 평면의 3차원 교차"></canvas><div class="hint"><b>조작:</b> 중심 C 또는 평면의 손잡이 H를 드래그하세요. 빈 곳 드래그는 회전, 휠은 확대·축소입니다.</div><div class="legend"><span><i class="dot" style="background:#b43b57"></i>구의 중심 C</span><span><i class="dot" style="background:#6558b5"></i>평면 손잡이 H</span><span>굵은 원: 교차 원</span></div></div><div class="toolbar"><button class="btn" id="viewReset">시점 초기화</button><button class="btn" id="animateBtn">평면 이동 애니메이션</button><label class="btn">평면 투명도 <input id="alpha" type="range" min="5" max="70" value="28"></label></div><div class="card" style="margin-top:10px;box-shadow:none"><h3>교차 평면에서 본 2차원 단면</h3><canvas id="section" style="width:100%;height:230px;min-height:230px;background:#f8fbff;border-radius:14px" aria-label="교차 단면 원"></canvas></div></section>
<aside class="side"><section class="card"><h2>구 설정</h2><div class="triple"><div class="field"><label>중심 x</label><input id="cx" type="number" step="0.5"></div><div class="field"><label>중심 y</label><input id="cy" type="number" step="0.5"></div><div class="field"><label>중심 z</label><input id="cz" type="number" step="0.5"></div></div><div class="row"><label>반지름 r</label><input id="r" type="range" min="0.5" max="5" step="0.1"><output id="rOut"></output></div><h3 style="margin-top:14px">평면 설정</h3><div class="row"><label>방위각</label><input id="az" type="range" min="-180" max="180" step="1"><output id="azOut"></output></div><div class="row"><label>기울기</label><input id="el" type="range" min="-90" max="90" step="1"><output id="elOut"></output></div><div class="row"><label>위치 k</label><input id="k" type="range" min="-8" max="8" step="0.05"><output id="kOut"></output></div><div class="eq" id="planeEq"></div><div class="stats"><div class="stat"><b>중심에서 평면까지 거리 d</b><span id="dStat"></span></div><div class="stat"><b>d와 r 비교</b><span id="relation"></span></div><div class="stat"><b>교차 원 중심 Q</b><span id="qStat"></span></div><div class="stat"><b>교차 원 반지름 ρ</b><span id="rhoStat"></span></div></div></section>
<section class="card"><h3>판정 근거</h3><div class="feedback" id="reason"></div></section>

<section class="card record"><h3>관찰 기록</h3><textarea id="record" placeholder="예: 평면이 구의 중심에 가까워질수록 단면 원의 반지름이 커진다."></textarea><button class="btn" id="copyRecord">기록 복사</button></section></aside></div>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const fmt=(v,d=2)=>{if(!Number.isFinite(v))return '—';let s=(Math.round(v*10**d)/10**d).toFixed(d);return s.replace(/\.0+$|(?<=\.[0-9]*?)0+$/,'')};
const V={add:(a,b)=>a.map((x,i)=>x+b[i]),sub:(a,b)=>a.map((x,i)=>x-b[i]),mul:(a,k)=>a.map(x=>x*k),dot:(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len:a=>Math.hypot(...a),unit:a=>{let l=Math.hypot(...a)||1;return a.map(x=>x/l)}};
function basisFromNormal(n){n=V.unit(n);let t=Math.abs(n[2])<.88?[0,0,1]:[0,1,0];let u=V.unit(V.cross(n,t));let v=V.cross(n,u);return [u,v]}
function makeView(canvas,draw){const ctx=canvas.getContext('2d');const view={yaw:-.65,pitch:.45,zoom:52,cx:0,cy:0,dpr:1,drag:null};
 function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);view.dpr=d;view.cx=canvas.width/2;view.cy=canvas.height/2;draw()}
 function rot(p){let cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),cp=Math.cos(view.pitch),sp=Math.sin(view.pitch);let x=cy*p[0]-sy*p[1],y=sy*p[0]+cy*p[1],z=p[2];return [x,cp*y-sp*z,sp*y+cp*z]}
 function proj(p){let q=rot(p);return [view.cx+view.zoom*view.dpr*q[0],view.cy-view.zoom*view.dpr*q[2],q[1]]}
 function worldRightUp(){let cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),sp=Math.sin(view.pitch),cp=Math.cos(view.pitch);return [[cy,-sy,0],[sp*sy,sp*cy,cp]]}
 function line3(a,b,style='#486078',w=1,dash=[]){let A=proj(a),B=proj(b);ctx.save();ctx.strokeStyle=style;ctx.lineWidth=w*view.dpr;ctx.setLineDash(dash.map(x=>x*view.dpr));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.restore()}
 function poly3(points,stroke='#486078',fill=null,w=1,dash=[]){if(!points.length)return;ctx.save();ctx.strokeStyle=stroke;ctx.fillStyle=fill||'transparent';ctx.lineWidth=w*view.dpr;ctx.setLineDash(dash.map(x=>x*view.dpr));ctx.beginPath();let p=proj(points[0]);ctx.moveTo(p[0],p[1]);for(let i=1;i<points.length;i++){p=proj(points[i]);ctx.lineTo(p[0],p[1])}if(fill)ctx.fill();ctx.stroke();ctx.restore()}
 function circle3(c,r,u=[1,0,0],v=[0,1,0],stroke='#b43b57',w=2,dash=[]){let pts=[];for(let i=0;i<=96;i++){let t=2*Math.PI*i/96;pts.push(V.add(c,V.add(V.mul(u,r*Math.cos(t)),V.mul(v,r*Math.sin(t)))))}poly3(pts,stroke,null,w,dash)}
 function sphere(c,r,opts={}){let C=proj(c),R=Math.max(1,r*view.zoom*view.dpr);ctx.save();let g=ctx.createRadialGradient(C[0]-R*.28,C[1]-R*.35,R*.08,C[0],C[1],R);g.addColorStop(0,opts.light||'rgba(255,255,255,.92)');g.addColorStop(.28,opts.mid||'rgba(96,194,184,.58)');g.addColorStop(1,opts.dark||'rgba(34,105,135,.62)');ctx.fillStyle=g;ctx.strokeStyle=opts.stroke||'#1a5874';ctx.lineWidth=2*view.dpr;ctx.beginPath();ctx.arc(C[0],C[1],R,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
   for(let lat=-60;lat<=60;lat+=30){let z=r*Math.sin(lat*Math.PI/180),rr=r*Math.cos(lat*Math.PI/180);circle3(V.add(c,[0,0,z]),rr,[1,0,0],[0,1,0],'rgba(20,80,105,.42)',.7,[3,3])}
   for(let lon=0;lon<180;lon+=45){let a=lon*Math.PI/180,u=[Math.cos(a),Math.sin(a),0];circle3(c,r,u,[0,0,1],'rgba(20,80,105,.34)',.7,[3,3])}}
 function axes(L=7){line3([-L,0,0],[L,0,0],'#8a4155',1.3);line3([0,-L,0],[0,L,0],'#1c756c',1.3);line3([0,0,-L],[0,0,L],'#385fa2',1.3);[['x',[L,0,0]],['y',[0,L,0]],['z',[0,0,L]]].forEach(([t,p])=>{let q=proj(p);ctx.save();ctx.fillStyle='#20314b';ctx.font=`${13*view.dpr}px system-ui`;ctx.fillText(t,q[0]+4*view.dpr,q[1]-4*view.dpr);ctx.restore()})}
 function point(p,label,color='#b43b57',rad=6){let q=proj(p);ctx.save();ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=2*view.dpr;ctx.beginPath();ctx.arc(q[0],q[1],rad*view.dpr,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#1a2940';ctx.font=`bold ${12*view.dpr}px system-ui`;ctx.fillText(label,q[0]+8*view.dpr,q[1]-8*view.dpr);ctx.restore();return q}
 function plane(c,n,size=6,alpha=.22,stroke='#5e56a8'){let [u,v]=basisFromNormal(n),p=[V.add(c,V.add(V.mul(u,-size),V.mul(v,-size))),V.add(c,V.add(V.mul(u,size),V.mul(v,-size))),V.add(c,V.add(V.mul(u,size),V.mul(v,size))),V.add(c,V.add(V.mul(u,-size),V.mul(v,size)))];poly3([...p,p[0]],stroke,`rgba(113,97,185,${alpha})`,1.5,[6,4]);return [u,v]}
 canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*(e.deltaY>0?.9:1.1),18,130);draw()},{passive:false});

 window.addEventListener('resize',resize);view.ctx=ctx;view.proj=proj;view.rot=rot;view.line3=line3;view.poly3=poly3;view.circle3=circle3;view.sphere=sphere;view.axes=axes;view.point=point;view.plane=plane;view.worldRightUp=worldRightUp;view.resize=resize;return view}
function signed(v){return v<0?`+ ${fmt(-v)}`:`− ${fmt(v)}`};
function sqTerm(name,a){if(Math.abs(a)<1e-9)return `${name}²`;return `(${name}${a>=0?' − '+fmt(a):' + '+fmt(-a)})²`}
function setupShell(resetAll,newActivity,helpHtml){$('#homeBtn').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});resetAll(true)};$('#resetBtn').onclick=()=>resetAll(false);$('#newBtn').onclick=newActivity;$('#helpBtn').onclick=()=>{$('#helpBody').innerHTML=helpHtml;$('#helpModal').classList.add('open')};$('#closeHelp').onclick=()=>$('#helpModal').classList.remove('open');$('#helpModal').onclick=e=>{if(e.target.id==='helpModal')e.currentTarget.classList.remove('open')};$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.body.dataset.mode=b.dataset.mode;$('#missionCard').classList.toggle('hidden',b.dataset.mode!=='mission')});$('#copyRecord').onclick=async()=>{let t=$('#record').value;try{await navigator.clipboard.writeText(t);$('#copyRecord').textContent='복사됨 ✓';setTimeout(()=>$('#copyRecord').textContent='기록 복사',1100)}catch{$('#record').select();document.execCommand('copy')}}}


const canvas=$('#scene'),section=$('#section');let state={C:[.8,-.5,1],r:3,az:25*Math.PI/180,el:38*Math.PI/180,k:1.2,alpha:.28,anim:false};let lastPts={};const view=makeView(canvas,draw);
function normal(){return [Math.cos(state.el)*Math.cos(state.az),Math.cos(state.el)*Math.sin(state.az),Math.sin(state.el)]}
function calc(){let n=normal(),s=V.dot(n,state.C)-state.k,d=Math.abs(s),Q=V.sub(state.C,V.mul(n,s)),rho2=state.r*state.r-d*d;return {n,s,d,Q,rho2,rho:Math.sqrt(Math.max(0,rho2))}}
view.hitTest=e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*view.dpr,y=(e.clientY-r.top)*view.dpr;for(let k of ['H','C']){let q=lastPts[k];if(q&&Math.hypot(x-q[0],y-q[1])<22*view.dpr)return k}return 'rotate'};view.onDrag=(mode,dx,dy)=>{let [right,up]=view.worldRightUp(),s=1/view.zoom,dv=V.add(V.mul(right,dx*s),V.mul(up,-dy*s));if(mode==='C'){state.C=state.C.map((v,i)=>clamp(v+dv[i],-5,5));syncInputs()}else if(mode==='H'){state.k=clamp(state.k+V.dot(normal(),dv),-8,8);$('#k').value=state.k}update()};
function draw(){let {ctx}=view;ctx.clearRect(0,0,canvas.width,canvas.height);view.axes(7);let {n,Q,rho2,rho}=calc();let H=V.mul(n,state.k);view.plane(H,n,6,state.alpha,'#6558b5');view.sphere(state.C,state.r);if(rho2>1e-8){let [u,v]=basisFromNormal(n);view.circle3(Q,rho,u,v,'#e28a18',4)}else if(Math.abs(rho2)<=1e-8)view.point(Q,'접점','#e28a18',8);view.line3(state.C,Q,'#bd3d58',2,[6,4]);lastPts.C=view.point(state.C,'C','#b43b57',7);lastPts.H=view.point(H,'H','#6558b5',7);drawSection()}
function drawSection(){let c=section.getContext('2d'),r=section.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(section.width!==Math.round(r.width*d)||section.height!==Math.round(r.height*d)){section.width=Math.round(r.width*d);section.height=Math.round(r.height*d)}c.clearRect(0,0,section.width,section.height);let {d:dist,rho2,rho}=calc(),W=section.width,H=section.height,scale=Math.min(W/(2*state.r+4)/d,H/(2*state.r+3)/d),cx=W*.36,cy=H*.5;c.save();c.strokeStyle='#315c78';c.lineWidth=2*d;c.beginPath();c.arc(cx,cy,state.r*scale,0,Math.PI*2);c.stroke();let px=cx+dist*scale;c.strokeStyle='#6558b5';c.lineWidth=3*d;c.setLineDash([7*d,4*d]);c.beginPath();c.moveTo(px,cy-state.r*1.35*scale);c.lineTo(px,cy+state.r*1.35*scale);c.stroke();c.setLineDash([]);c.fillStyle='#b43b57';c.beginPath();c.arc(cx,cy,5*d,0,Math.PI*2);c.fill();if(rho2>0){c.strokeStyle='#e28a18';c.lineWidth=7*d;c.beginPath();c.moveTo(px,cy-rho*scale);c.lineTo(px,cy+rho*scale);c.stroke()}else if(Math.abs(rho2)<1e-8){c.fillStyle='#e28a18';c.beginPath();c.arc(px,cy,6*d,0,Math.PI*2);c.fill()}c.fillStyle='#20314b';c.font=`${13*d}px system-ui`;c.fillText(`d=${fmt(dist)}  r=${fmt(state.r)}  ρ=${rho2>=0?fmt(rho):'없음'}`,W*.68,H*.35);c.fillText(rho2>1e-8?'평면 위에서는 반지름 ρ인 원':Math.abs(rho2)<=1e-8?'한 점에서 접함':'공통점 없음',W*.68,H*.52);c.fillText('ρ² = r² − d²',W*.68,H*.69);c.restore()}
function coeff(v,name){if(Math.abs(v)<.005)return '';return `${v>=0?'+':'−'} ${fmt(Math.abs(v),2)}${name} `}
function update(){let {n,d,Q,rho2,rho}=calc();$('#rOut').textContent=fmt(state.r);$('#azOut').textContent=`${fmt(state.az*180/Math.PI,0)}°`;$('#elOut').textContent=`${fmt(state.el*180/Math.PI,0)}°`;$('#kOut').textContent=fmt(state.k);let a=n[0],b=n[1],c=n[2];$('#planeEq').textContent=`${fmt(a,2)}x ${coeff(b,'y')}${coeff(c,'z')}= ${fmt(state.k,2)}`.replace('+ −','− ');$('#dStat').textContent=fmt(d,3);let rel=d>state.r+1e-7?'d > r':Math.abs(d-state.r)<1e-7?'d = r':'d < r';$('#relation').textContent=rel;$('#qStat').textContent=`(${Q.map(x=>fmt(x)).join(', ')})`;$('#rhoStat').textContent=rho2>=0?fmt(rho,3):'존재하지 않음';let msg=d>state.r?`d=${fmt(d)}가 r=${fmt(state.r)}보다 크므로 구와 평면은 만나지 않습니다.`:Math.abs(d-state.r)<1e-6?`d=r이므로 평면은 구에 접하고 공통점은 한 점입니다.`:`d<r이므로 원으로 만나며 ρ=√(r²−d²)=${fmt(rho)}입니다.`;$('#reason').textContent=msg;$('#reason').className='feedback '+(d<=state.r?'ok':'bad');draw()}
function syncInputs(){['cx','cy','cz'].forEach((id,i)=>$('#'+id).value=fmt(state.C[i],2));$('#r').value=state.r;$('#az').value=state.az*180/Math.PI;$('#el').value=state.el*180/Math.PI;$('#k').value=state.k;$('#alpha').value=state.alpha*100}
['cx','cy','cz'].forEach((id,i)=>$('#'+id).oninput=e=>{let v=Number(e.target.value);if(Number.isFinite(v)){state.C[i]=clamp(v,-5,5);update()}});$('#r').oninput=e=>{state.r=Number(e.target.value);update()};$('#az').oninput=e=>{state.az=Number(e.target.value)*Math.PI/180;update()};$('#el').oninput=e=>{state.el=Number(e.target.value)*Math.PI/180;update()};$('#k').oninput=e=>{state.k=Number(e.target.value);update()};$('#alpha').oninput=e=>{state.alpha=Number(e.target.value)/100;draw()};$('#viewReset').onclick=()=>{view.yaw=-.65;view.pitch=.45;view.zoom=52;draw()};
let raf,last=0;function animate(t){if(!state.anim)return;let nc=V.dot(normal(),state.C);state.k=nc+state.r*1.25*Math.sin(t/1200);$('#k').value=state.k;update();raf=requestAnimationFrame(animate)}$('#animateBtn').onclick=()=>{state.anim=!state.anim;$('#animateBtn').textContent=state.anim?'애니메이션 멈추기':'평면 이동 애니메이션';if(state.anim)raf=requestAnimationFrame(animate);else cancelAnimationFrame(raf)};
const missions=[
 ()=>({t:'접하는 평면 만들기',x:'현재 구에 평면이 한 점에서 접하도록 위치 k를 조절하세요.',ok:()=>Math.abs(calc().d-state.r)<.05,why:'중심에서 평면까지의 거리 d가 반지름 r과 같아야 합니다.'}),
 ()=>({t:'교차 원 반지름 2',x:'구의 반지름을 3으로 하고 교차 원의 반지름 ρ가 2가 되도록 평면을 옮기세요.',ok:()=>Math.abs(state.r-3)<.05&&Math.abs(calc().rho-2)<.05,why:'ρ²=r²−d²이므로 r=3, ρ=2일 때 d=√5입니다.'}),
 ()=>({t:'가장 큰 단면 만들기',x:'평면이 구의 중심을 지나도록 조절하여 가장 큰 단면 원을 만드세요.',ok:()=>calc().d<.04&&Math.abs(calc().rho-state.r)<.04,why:'d=0일 때 ρ=r이 되어 단면 원이 가장 큽니다.'}),
 ()=>({t:'공통점 없게 하기',x:'반지름을 2로 맞추고 평면이 구와 만나지 않게 하세요.',ok:()=>Math.abs(state.r-2)<.05&&calc().d>state.r+.05,why:'공통점이 없으려면 d>r이어야 합니다.'}),
 ()=>({t:'기울어진 원 단면',x:'평면의 방위각을 45°, 기울기를 30°로 맞추고 구와 원으로 만나게 하세요.',ok:()=>Math.abs(state.az*180/Math.PI-45)<1.1&&Math.abs(state.el*180/Math.PI-30)<1.1&&calc().d<state.r-.05,why:'각도를 먼저 맞춘 뒤 위치 k를 조절하여 d<r로 만드세요.'}),
 ()=>({t:'목표 중심과 단면',x:'구의 중심을 (1,1,1), 반지름을 4로 하고 단면 반지름이 √12≈3.46이 되게 하세요.',ok:()=>V.len(V.sub(state.C,[1,1,1]))<.08&&Math.abs(state.r-4)<.05&&Math.abs(calc().rho-Math.sqrt(12))<.06,why:'ρ²=r²−d²=12이므로 d=2가 되도록 평면 위치를 조절하세요.'})];let mi=-1,mission;function newMission(){mi=(mi+1+Math.floor(Math.random()*(missions.length-1)))%missions.length;mission=missions[mi]();$('#missionTitle').textContent=mission.t;$('#missionText').textContent=mission.x;$('#feedback').className='feedback';$('#feedback').textContent='조건을 맞춘 뒤 확인해 보세요.'}$('#checkMission').onclick=()=>{let ok=mission.ok();$('#feedback').className='feedback '+(ok?'ok':'bad');$('#feedback').textContent=ok?'성공! 3차원 교차 원과 2차원 단면이 같은 반지름을 나타냅니다.':mission.why};
function resetAll(full){state={C:[.8,-.5,1],r:3,az:25*Math.PI/180,el:38*Math.PI/180,k:1.2,alpha:.28,anim:false};cancelAnimationFrame(raf);$('#animateBtn').textContent='평면 이동 애니메이션';view.yaw=-.65;view.pitch=.45;view.zoom=52;syncInputs();update();if(full){document.body.dataset.mode='free';$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='free'));$('#missionCard').classList.add('hidden')}}
setupShell(resetAll,newMission,`<h2>구와 평면의 교차 시뮬레이터 도움말</h2><p>구의 중심 C에서 평면까지의 거리를 d, 구의 반지름을 r라 하면 위치 관계는 다음과 같습니다.</p><ul><li>d&gt;r: 만나지 않음</li><li>d=r: 한 점에서 접함</li><li>d&lt;r: 원으로 만남</li></ul><p>원으로 만날 때 교차 원의 중심은 C에서 평면에 내린 수선의 발 Q이고, 반지름은 <b>ρ=√(r²−d²)</b>입니다.</p><p>평면을 중심 쪽으로 이동시키며 2차원 단면이 커졌다가 다시 작아지는 과정을 관찰하세요.</p>`);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')view.yaw-=.08;if(e.key==='ArrowRight')view.yaw+=.08;if(e.key==='ArrowUp')view.pitch-=.08;if(e.key==='ArrowDown')view.pitch+=.08;if(e.key==='+')view.zoom*=1.08;if(e.key==='-')view.zoom*=.92;draw()});newMission();resetAll(false);requestAnimationFrame(()=>{view.resize();drawSection()});
</script></body></html>

<header class="topbar"><div class="titleline"><div><div class="chapter">Ⅱ. 공간도형과 공간좌표 · 6. 구의 방정식</div><h1>일반형 구 판별기</h1></div><div class="actions"><button class="btn" id="homeBtn">처음으로</button><button class="btn" id="resetBtn">초기화</button><button class="btn warn" id="newBtn">새 활동</button><button class="btn" id="helpBtn">도움말</button></div></div><div class="modebar"><button class="btn active" data-mode="free">자유 탐색</button><button class="btn" data-mode="mission">미션 활동</button></div></header>

<div class="grid"><section class="card stage-card"><div class="stage-wrap"><canvas id="scene" aria-label="일반형 방정식이 나타내는 구, 한 점 또는 실수점 없음"></canvas><div class="hint"><b>조작:</b> A, B, C, D를 바꾸며 완전제곱과 r²의 부호를 관찰하세요. 빈 곳 드래그는 회전, 휠은 확대·축소입니다.</div><div class="legend"><span><i class="dot" style="background:#b43b57"></i>중심</span><span>r²&gt;0 구 · r²=0 한 점 · r²&lt;0 실수점 없음</span></div></div><div class="toolbar"><button class="btn" id="viewReset">시점 초기화</button><label class="btn">격자 <input id="gridToggle" type="checkbox" checked></label></div></section>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const fmt=(v,d=2)=>{if(!Number.isFinite(v))return '—';let s=(Math.round(v*10**d)/10**d).toFixed(d);return s.replace(/\.0+$|(?<=\.[0-9]*?)0+$/,'')};
const V={add:(a,b)=>a.map((x,i)=>x+b[i]),sub:(a,b)=>a.map((x,i)=>x-b[i]),mul:(a,k)=>a.map(x=>x*k),dot:(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len:a=>Math.hypot(...a),unit:a=>{let l=Math.hypot(...a)||1;return a.map(x=>x/l)}};
function basisFromNormal(n){n=V.unit(n);let t=Math.abs(n[2])<.88?[0,0,1]:[0,1,0];let u=V.unit(V.cross(n,t));let v=V.cross(n,u);return [u,v]}
function makeView(canvas,draw){const ctx=canvas.getContext('2d');const view={yaw:-.65,pitch:.45,zoom:52,cx:0,cy:0,dpr:1,drag:null};
 function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);view.dpr=d;view.cx=canvas.width/2;view.cy=canvas.height/2;draw()}
 function rot(p){let cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),cp=Math.cos(view.pitch),sp=Math.sin(view.pitch);let x=cy*p[0]-sy*p[1],y=sy*p[0]+cy*p[1],z=p[2];return [x,cp*y-sp*z,sp*y+cp*z]}
 function proj(p){let q=rot(p);return [view.cx+view.zoom*view.dpr*q[0],view.cy-view.zoom*view.dpr*q[2],q[1]]}
 function worldRightUp(){let cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),sp=Math.sin(view.pitch),cp=Math.cos(view.pitch);return [[cy,-sy,0],[sp*sy,sp*cy,cp]]}
 function line3(a,b,style='#486078',w=1,dash=[]){let A=proj(a),B=proj(b);ctx.save();ctx.strokeStyle=style;ctx.lineWidth=w*view.dpr;ctx.setLineDash(dash.map(x=>x*view.dpr));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.restore()}
 function poly3(points,stroke='#486078',fill=null,w=1,dash=[]){if(!points.length)return;ctx.save();ctx.strokeStyle=stroke;ctx.fillStyle=fill||'transparent';ctx.lineWidth=w*view.dpr;ctx.setLineDash(dash.map(x=>x*view.dpr));ctx.beginPath();let p=proj(points[0]);ctx.moveTo(p[0],p[1]);for(let i=1;i<points.length;i++){p=proj(points[i]);ctx.lineTo(p[0],p[1])}if(fill)ctx.fill();ctx.stroke();ctx.restore()}
 function circle3(c,r,u=[1,0,0],v=[0,1,0],stroke='#b43b57',w=2,dash=[]){let pts=[];for(let i=0;i<=96;i++){let t=2*Math.PI*i/96;pts.push(V.add(c,V.add(V.mul(u,r*Math.cos(t)),V.mul(v,r*Math.sin(t)))))}poly3(pts,stroke,null,w,dash)}
 function sphere(c,r,opts={}){let C=proj(c),R=Math.max(1,r*view.zoom*view.dpr);ctx.save();let g=ctx.createRadialGradient(C[0]-R*.28,C[1]-R*.35,R*.08,C[0],C[1],R);g.addColorStop(0,opts.light||'rgba(255,255,255,.92)');g.addColorStop(.28,opts.mid||'rgba(96,194,184,.58)');g.addColorStop(1,opts.dark||'rgba(34,105,135,.62)');ctx.fillStyle=g;ctx.strokeStyle=opts.stroke||'#1a5874';ctx.lineWidth=2*view.dpr;ctx.beginPath();ctx.arc(C[0],C[1],R,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
   for(let lat=-60;lat<=60;lat+=30){let z=r*Math.sin(lat*Math.PI/180),rr=r*Math.cos(lat*Math.PI/180);circle3(V.add(c,[0,0,z]),rr,[1,0,0],[0,1,0],'rgba(20,80,105,.42)',.7,[3,3])}
   for(let lon=0;lon<180;lon+=45){let a=lon*Math.PI/180,u=[Math.cos(a),Math.sin(a),0];circle3(c,r,u,[0,0,1],'rgba(20,80,105,.34)',.7,[3,3])}}
 function axes(L=7){line3([-L,0,0],[L,0,0],'#8a4155',1.3);line3([0,-L,0],[0,L,0],'#1c756c',1.3);line3([0,0,-L],[0,0,L],'#385fa2',1.3);[['x',[L,0,0]],['y',[0,L,0]],['z',[0,0,L]]].forEach(([t,p])=>{let q=proj(p);ctx.save();ctx.fillStyle='#20314b';ctx.font=`${13*view.dpr}px system-ui`;ctx.fillText(t,q[0]+4*view.dpr,q[1]-4*view.dpr);ctx.restore()})}
 function point(p,label,color='#b43b57',rad=6){let q=proj(p);ctx.save();ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=2*view.dpr;ctx.beginPath();ctx.arc(q[0],q[1],rad*view.dpr,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#1a2940';ctx.font=`bold ${12*view.dpr}px system-ui`;ctx.fillText(label,q[0]+8*view.dpr,q[1]-8*view.dpr);ctx.restore();return q}
 function plane(c,n,size=6,alpha=.22,stroke='#5e56a8'){let [u,v]=basisFromNormal(n),p=[V.add(c,V.add(V.mul(u,-size),V.mul(v,-size))),V.add(c,V.add(V.mul(u,size),V.mul(v,-size))),V.add(c,V.add(V.mul(u,size),V.mul(v,size))),V.add(c,V.add(V.mul(u,-size),V.mul(v,size)))];poly3([...p,p[0]],stroke,`rgba(113,97,185,${alpha})`,1.5,[6,4]);return [u,v]}
 canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*(e.deltaY>0?.9:1.1),18,130);draw()},{passive:false});

 window.addEventListener('resize',resize);view.ctx=ctx;view.proj=proj;view.rot=rot;view.line3=line3;view.poly3=poly3;view.circle3=circle3;view.sphere=sphere;view.axes=axes;view.point=point;view.plane=plane;view.worldRightUp=worldRightUp;view.resize=resize;return view}
function signed(v){return v<0?`+ ${fmt(-v)}`:`− ${fmt(v)}`};
function sqTerm(name,a){if(Math.abs(a)<1e-9)return `${name}²`;return `(${name}${a>=0?' − '+fmt(a):' + '+fmt(-a)})²`}
function setupShell(resetAll,newActivity,helpHtml){$('#homeBtn').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});resetAll(true)};$('#resetBtn').onclick=()=>resetAll(false);$('#newBtn').onclick=newActivity;$('#helpBtn').onclick=()=>{$('#helpBody').innerHTML=helpHtml;$('#helpModal').classList.add('open')};$('#closeHelp').onclick=()=>$('#helpModal').classList.remove('open');$('#helpModal').onclick=e=>{if(e.target.id==='helpModal')e.currentTarget.classList.remove('open')};$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.body.dataset.mode=b.dataset.mode;$('#missionCard').classList.toggle('hidden',b.dataset.mode!=='mission')});$('#copyRecord').onclick=async()=>{let t=$('#record').value;try{await navigator.clipboard.writeText(t);$('#copyRecord').textContent='복사됨 ✓';setTimeout(()=>$('#copyRecord').textContent='기록 복사',1100)}catch{$('#record').select();document.execCommand('copy')}}}


const canvas=$('#scene');let state={A:4,B:-2,C:6,D:5,grid:true};let selectedChoice='';const view=makeView(canvas,draw);
function coeffText(k,v){if(Math.abs(v)<1e-9)return '';let sign=v>0?'+':'−',n=Math.abs(v),mag=Math.abs(n-1)<1e-9?'':fmt(n);return ` ${sign} ${mag}${k}`}
function calc(){let {A,B,C,D}=state;let center=[-A/2,-B/2,-C/2],r2=(A*A+B*B+C*C)/4-D;return {center,r2}}
function drawGrid(){if(!state.grid)return;for(let i=-6;i<=6;i++){view.line3([-6,i,0],[6,i,0],'rgba(70,95,120,.16)',.6);view.line3([i,-6,0],[i,6,0],'rgba(70,95,120,.16)',.6)}}
function draw(){let {ctx}=view;ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid();view.axes(7);let {center,r2}=calc();if(r2>1e-8){view.sphere(center,Math.sqrt(r2));view.point(center,'C','#b43b57',7)}else if(Math.abs(r2)<=1e-8){view.point(center,'한 점','#b43b57',10);for(let r=13;r<38;r+=9){let q=view.proj(center);ctx.save();ctx.strokeStyle='rgba(180,59,87,.45)';ctx.lineWidth=2*view.dpr;ctx.beginPath();ctx.arc(q[0],q[1],r*view.dpr,0,Math.PI*2);ctx.stroke();ctx.restore()}}else{let q=view.proj(center);ctx.save();ctx.strokeStyle='#c33b3b';ctx.lineWidth=4*view.dpr;ctx.beginPath();ctx.moveTo(q[0]-24*view.dpr,q[1]-24*view.dpr);ctx.lineTo(q[0]+24*view.dpr,q[1]+24*view.dpr);ctx.moveTo(q[0]+24*view.dpr,q[1]-24*view.dpr);ctx.lineTo(q[0]-24*view.dpr,q[1]+24*view.dpr);ctx.stroke();ctx.font=`bold ${15*view.dpr}px system-ui`;ctx.fillStyle='#9d2525';ctx.fillText('실수인 점이 없음',q[0]+30*view.dpr,q[1]);ctx.restore()}}
function update(){let {A,B,C,D}=state,{center,r2}=calc();$('#generalEq').textContent=`x² + y² + z²${coeffText('x',A)}${coeffText('y',B)}${coeffText('z',C)}${D===0?'':` ${D>0?'+':'−'} ${fmt(Math.abs(D))}`} = 0`;let left=`${sqTerm('x',center[0])} + ${sqTerm('y',center[1])} + ${sqTerm('z',center[2])}`;$('#standardEq').textContent=`${left} = ${fmt(r2)}`;$('#centerStat').textContent=`(${center.map(x=>fmt(x)).join(', ')})`;$('#r2Stat').textContent=fmt(r2,3);let cls=r2>1e-8?'구':Math.abs(r2)<=1e-8?'한 점':'실수인 점이 없음';$('#classStat').textContent=cls;$('#radiusStat').textContent=r2>0?fmt(Math.sqrt(r2),3):'정의되지 않음';
 let rhs=(A*A+B*B+C*C-4*D)/4;$('#steps').innerHTML=`<li>x² ${A>=0?'+':'−'} ${fmt(Math.abs(A))}x = (x ${A>=0?'+':'−'} ${fmt(Math.abs(A/2))})² − ${fmt(A*A/4)}</li><li>y² ${B>=0?'+':'−'} ${fmt(Math.abs(B))}y = (y ${B>=0?'+':'−'} ${fmt(Math.abs(B/2))})² − ${fmt(B*B/4)}</li><li>z² ${C>=0?'+':'−'} ${fmt(Math.abs(C))}z = (z ${C>=0?'+':'−'} ${fmt(Math.abs(C/2))})² − ${fmt(C*C/4)}</li><li>상수항을 옮기고 더한 값을 정리하면 오른쪽은 <b>${fmt(rhs)}</b>입니다.</li><li>${r2>0?'r²>0이므로 중심과 반지름을 가진 구입니다.':Math.abs(r2)<1e-8?'r²=0이므로 중심 한 점만 남습니다.':'r²<0인데 제곱의 합은 음수가 될 수 없으므로 실수인 점이 없습니다.'}</li>`;draw()}
const coefRows=$('#coefRows');['A','B','C','D'].forEach(k=>{let wrap=document.createElement('div');wrap.className='row';wrap.innerHTML=`<label>${k}</label><input type="range" min="-12" max="12" step="1" id="${k}Range"><input type="number" min="-30" max="30" step="1" id="${k}Num">`;coefRows.appendChild(wrap);let sync=v=>{state[k]=clamp(Number(v)||0,-30,30);$('#'+k+'Range').value=clamp(state[k],-12,12);$('#'+k+'Num').value=state[k];update()};$('#'+k+'Range').oninput=e=>sync(e.target.value);$('#'+k+'Num').oninput=e=>sync(e.target.value)});
function syncInputs(){['A','B','C','D'].forEach(k=>{$('#'+k+'Range').value=clamp(state[k],-12,12);$('#'+k+'Num').value=state[k]})}
$('#gridToggle').onchange=e=>{state.grid=e.target.checked;draw()};$('#viewReset').onclick=()=>{view.yaw=-.65;view.pitch=.45;view.zoom=52;draw()};
const missionFactories=[
 ()=>({t:'도형 판정하기',x:'현재 계수를 완전제곱하여 어떤 도형인지 선택하세요.',choices:['구','한 점','실수인 점이 없음'],ok:()=>selectedChoice===(calc().r2>0?'구':Math.abs(calc().r2)<1e-8?'한 점':'실수인 점이 없음'),why:'r²의 부호를 확인하세요. 제곱의 합은 음수가 될 수 없습니다.',prepare:()=>{let cases=[[2,-4,6,-2],[4,2,-2,6],[2,2,2,8]][Math.floor(Math.random()*3)];[state.A,state.B,state.C,state.D]=cases}}),
 ()=>({t:'중심 만들기',x:'중심이 (2, -1, 3)인 구가 되도록 A, B, C를 조절하세요. D는 자유입니다.',ok:()=>V.len(V.sub(calc().center,[2,-1,3]))<.05&&calc().r2>0,why:'중심은 (−A/2, −B/2, −C/2)입니다. 또한 r²>0이어야 실제 구입니다.',prepare:()=>{state.D=0}}),
 ()=>({t:'한 점 만들기',x:'A=4, B=−2, C=6으로 맞추고, 방정식이 한 점을 나타내도록 D를 정하세요.',ok:()=>state.A===4&&state.B===-2&&state.C===6&&Math.abs(calc().r2)<.05,why:'한 점이 되려면 r²=(A²+B²+C²)/4−D=0이어야 합니다.',prepare:()=>{Object.assign(state,{A:4,B:-2,C:6,D:0})}}),
 ()=>({t:'실수점 없게 만들기',x:'A=2, B=4, C=0으로 맞추고, 실수인 점이 없도록 D를 조절하세요.',ok:()=>state.A===2&&state.B===4&&state.C===0&&calc().r2<-.05,why:'r²<0이 되도록 D를 (A²+B²+C²)/4보다 크게 해야 합니다.',prepare:()=>{Object.assign(state,{A:2,B:4,C:0,D:0})}}),
 ()=>({t:'반지름 3 만들기',x:'중심이 (−1, 2, 0), 반지름이 3인 구를 나타내도록 네 계수를 맞추세요.',ok:()=>V.len(V.sub(calc().center,[-1,2,0]))<.05&&Math.abs(calc().r2-9)<.05,why:'A=−2a, B=−2b, C=−2c이고 D=a²+b²+c²−r²입니다.',prepare:()=>{Object.assign(state,{A:0,B:0,C:0,D:0})}}),
 ()=>({t:'표준형에서 일반형으로',x:'(x−3)²+(y+1)²+(z−2)²=16이 되도록 A, B, C, D를 조절하세요.',ok:()=>V.len(V.sub(calc().center,[3,-1,2]))<.05&&Math.abs(calc().r2-16)<.05,why:'중심 (3,−1,2), r²=16을 일반형 계수와 연결하세요.',prepare:()=>{Object.assign(state,{A:0,B:0,C:0,D:0})}})];let mission,mi=-1;
function renderChoices(){let box=$('#missionChoices');box.innerHTML='';(mission.choices||[]).forEach(c=>{let b=document.createElement('button');b.className='btn';b.textContent=c;b.onclick=()=>{selectedChoice=c;[...box.children].forEach(x=>x.classList.toggle('primary',x===b))};box.appendChild(b)})}
function newMission(){mi=(mi+1+Math.floor(Math.random()*(missionFactories.length-1)))%missionFactories.length;mission=missionFactories[mi]();selectedChoice='';mission.prepare?.();syncInputs();update();$('#missionTitle').textContent=mission.t;$('#missionText').textContent=mission.x;renderChoices();$('#feedback').className='feedback';$('#feedback').textContent='계수를 조절하거나 답을 선택한 뒤 확인해 보세요.'}
$('#checkMission').onclick=()=>{let ok=mission.ok();$('#feedback').className='feedback '+(ok?'ok':'bad');$('#feedback').textContent=ok?'정확합니다! 완전제곱 단계와 3차원 모습을 함께 연결했습니다.':mission.why};
function resetAll(full){state={A:4,B:-2,C:6,D:5,grid:true};view.yaw=-.65;view.pitch=.45;view.zoom=52;$('#gridToggle').checked=true;syncInputs();update();if(full){document.body.dataset.mode='free';$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='free'));$('#missionCard').classList.add('hidden')}}
setupShell(resetAll,newMission,`<h2>일반형 구 판별기 도움말</h2><p>교과서의 일반형 <b>x²+y²+z²+Ax+By+Cz+D=0</b>을 각 변수별로 완전제곱하면 중심과 r²를 찾을 수 있습니다.</p><p>중심은 (−A/2, −B/2, −C/2), r²=(A²+B²+C²−4D)/4입니다.</p><ul><li>r²&gt;0: 구</li><li>r²=0: 한 점</li><li>r²&lt;0: 실수인 점이 없음</li></ul><p>미션에서는 계수를 직접 조절하여 세 경우를 만들어 보세요.</p>`);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')view.yaw-=.08;if(e.key==='ArrowRight')view.yaw+=.08;if(e.key==='ArrowUp')view.pitch-=.08;if(e.key==='ArrowDown')view.pitch+=.08;if(e.key==='+')view.zoom*=1.08;if(e.key==='-')view.zoom*=.92;draw()});newMission();resetAll(false);requestAnimationFrame(()=>view.resize());
</script></body></html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기존·새 썸네일 비교 검토판</title>
    <link rel="stylesheet" href="./assets/thumbnails/legacy/site.css" />
    <style>
      :root { color-scheme: light; }
      html { scroll-behavior: auto; }
      body { margin: 0; background: #f5f7fb; color: #111c35; }
      .comparison-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
      .comparison-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; padding: 16px 20px; border: 1px solid #dce3ee; border-radius: 18px; background: rgba(255,255,255,.95); box-shadow: 0 10px 28px rgba(17,28,53,.08); backdrop-filter: blur(12px); }
      .comparison-head h1 { margin: 0; font-size: clamp(21px, 2.4vw, 31px); letter-spacing: -.04em; }
      .comparison-head p { margin: 5px 0 0; color: #69758b; font-size: 14px; }
      .comparison-total { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; background: #e9f7f2; color: #167866; font-size: 13px; font-weight: 900; }
      .comparison-list { display: grid; gap: 15px; }
      .comparison-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
      .comparison-nav a { padding: 9px 13px; border-radius: 10px; background: white; border: 1px solid #dce3ee; color: #111c35; font-size: 13px; font-weight: 700; text-decoration: none; }
      .comparison-note { display: block; margin: 7px 0 0; color: #52647b; font-size: 12px; line-height: 1.45; }
      .comparison-status { display: inline-block; margin-top: 7px; color: #16816b; font-size: 11px; font-weight: 800; }
      .comparison-status.pending { color: #8a5a15; }
      .comparison-card { display: grid; grid-template-columns: 170px minmax(0, 1fr) 42px minmax(0, 1fr); align-items: center; gap: 12px; padding: 13px; border: 1px solid #dce3ee; border-radius: 22px; background: white; box-shadow: 0 4px 12px rgba(17,28,53,.04); }
      .comparison-name { min-width: 0; padding: 0 7px; }
      .comparison-number { display: grid; width: 42px; height: 42px; margin-bottom: 9px; place-items: center; border-radius: 14px; background: #111c35; color: white; font-size: 15px; font-weight: 950; }
      .comparison-name h2 { margin: 0; color: #111c35; font-size: 16px; line-height: 1.35; letter-spacing: -.025em; }
      .comparison-name small { display: block; overflow: hidden; margin-top: 5px; color: #8a95a8; font: 700 10px/1.35 ui-monospace, monospace; text-overflow: ellipsis; white-space: nowrap; }
      .comparison-pane { min-width: 0; }
      .pane-label { display: flex; align-items: center; gap: 7px; margin: 0 0 6px 2px; color: #778399; font-size: 12px; font-weight: 900; }
      .pane-label::before { width: 8px; height: 8px; border-radius: 50%; background: #aab3c2; content: ""; }
      .comparison-pane.new .pane-label { color: #178370; }
      .comparison-pane.new .pane-label::before { background: #42bea5; }
      .preview-host.tool-card { display: block; min-width: 0; overflow: hidden; border: 1px solid #dce3ee; border-radius: 18px; background: white; box-shadow: none; }
      .preview-host.tool-card .tool-visual,
      .candidate-visual { position: relative; display: grid; width: 100%; height: 190px; min-height: 190px; place-items: center; overflow: hidden; border-radius: 17px; }
      .candidate-visual { border: 1px solid #dce3ee; background: white; }
      .comparison-arrow { position: relative; width: 35px; height: 5px; border-radius: 99px; background: #ff6742; }
      .comparison-arrow::after { position: absolute; right: 0; top: -6px; width: 15px; height: 15px; border-right: 5px solid #ff6742; border-top: 5px solid #ff6742; content: ""; transform: rotate(45deg); }

      .scene-thumbnail { width: 100%; height: 100%; background: var(--scene-bg); color: var(--scene-ink, #111c35); }
      .scene-orbit { fill: none; stroke: rgba(17,28,53,.07); stroke-width: 2; }
      .scene-line { fill: none; stroke: var(--scene-ink, #111c35); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .scene-guide { fill: none; stroke: rgba(17,28,53,.18); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .scene-dash { stroke-dasharray: 8 9; }
      .scene-no-fill { fill: none !important; }
      .scene-accent-line { fill: none; stroke: var(--scene-accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .scene-mint-line { fill: none; stroke: #42bea5; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .scene-purple-line { fill: none; stroke: #8075dc; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .scene-white-fill { fill: white; stroke: #111c35; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .scene-accent-fill { fill: var(--scene-accent); stroke: #111c35; stroke-width: 4; }
      .scene-mint-fill { fill: #55c9b0; stroke: #111c35; stroke-width: 4; }
      .scene-warm-fill { fill: #ffc95c; stroke: #111c35; stroke-width: 4; }
      .scene-blue-fill { fill: #bcd8ff; stroke: #111c35; stroke-width: 4; }
      .scene-purple-fill { fill: #bdb5ff; stroke: #111c35; stroke-width: 4; }
      .scene-blue-soft { fill: #dbe9ff; stroke: none; }
      .scene-yellow-soft { fill: #ffe6a4; stroke: none; }
      .scene-mint-soft { fill: #c9eee3; stroke: #111c35; stroke-width: 3; }
      .scene-warm-soft { fill: #ffe0bd; stroke: #111c35; stroke-width: 3; }
      .scene-purple-soft { fill: #ded9ff; stroke: #111c35; stroke-width: 3; }
      .scene-accent-soft { fill: color-mix(in srgb, var(--scene-accent) 33%, white); stroke: #111c35; stroke-width: 3; }
      .scene-translucent { fill-opacity: .18; }
      .scene-dots circle,
      .scene-output-dots circle { fill: #55c9b0; stroke: #111c35; stroke-width: 4; }
      .scene-output-dots circle:nth-child(2) { fill: #ffc95c; }
      .scene-plot-points circle { fill: white; stroke: #111c35; stroke-width: 4; }

      /* 색상만 수정하는 16·17·36번은 기존 마크업과 배치를 그대로 사용합니다. */
      .candidate-recolor.card-conic-lab .tool-visual { color: #111c35; background: #edf3ff; }
      .candidate-recolor.card-conic-lab .conic-preview { background: radial-gradient(circle at 24% 50%, rgba(93,145,239,.18), transparent 28%), radial-gradient(circle at 78% 45%, rgba(128,117,220,.15), transparent 31%); }
      .candidate-recolor.card-conic-lab .conic-preview__dish { border-color: #5d91ef; }
      .candidate-recolor.card-conic-lab .conic-preview__focus { border-color: #111c35; background: #ffc95c; box-shadow: 0 0 0 5px rgba(255,201,92,.22); }
      .candidate-recolor.card-conic-lab .conic-preview__ray { background: #42bea5; }
      .candidate-recolor.card-conic-lab .conic-preview__ray::before { background: #ff6742; }
      .candidate-recolor.card-conic-lab .conic-preview__cone { border-bottom-color: rgba(128,117,220,.36); }
      .candidate-recolor.card-conic-lab .conic-preview__cone::after { border-top-color: rgba(93,145,239,.3); }
      .candidate-recolor.card-conic-lab .conic-preview__plane { border-color: #ff6742; background: rgba(255,103,66,.12); }
      .candidate-recolor.card-conic-lab .conic-preview em { color: #111c35; background: #55c9b0; }

      .candidate-recolor.card-ecosystem .tool-visual { background: radial-gradient(circle at 72% 24%, rgba(255,201,92,.28), transparent 25%), linear-gradient(145deg, #edf9f4, #e4f5ee); }
      .candidate-recolor.card-ecosystem .ecosystem-preview { border-bottom-color: rgba(17,28,53,.18); }
      .candidate-recolor.card-ecosystem .ecosystem-preview__rabbit,
      .candidate-recolor.card-ecosystem .ecosystem-preview__fox { border-color: #111c35; background: rgba(255,255,255,.82); }
      .candidate-recolor.card-ecosystem .ecosystem-preview__curve.curve-a { border-color: #42bea5; }
      .candidate-recolor.card-ecosystem .ecosystem-preview__curve.curve-b { border-color: #ff6742; }
      .candidate-recolor.card-ecosystem .ecosystem-preview > b { color: #bd7c00; }
      .candidate-recolor.card-ecosystem .ecosystem-preview > small { color: #526c68; }

      .candidate-recolor.card-symbol-guessing .tool-visual { background: radial-gradient(circle at 78% 25%, rgba(255,201,92,.28), transparent 27%), linear-gradient(145deg, #edf8f4, #f2efff); }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview { border-color: #cfd8e5; background: rgba(255,255,255,.68); }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__word { border-color: #c8d2e2; background: white; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__word b { color: #d88800; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__word span { color: #278c7a; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__choices span { border-color: #aab9ca; color: #111c35; background: white; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__bars { border-bottom-color: #8da0b5; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__bars i { border-color: #42bea5; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview__bars i:nth-child(4) { background: rgba(66,190,165,.35); }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview > strong { color: #c67e00; }
      .candidate-recolor.card-symbol-guessing .symbol-guessing-preview > small { color: #667789; }

      .comparison-loading { padding: 80px 20px; color: #69758b; text-align: center; }
      @media (max-width: 640px) { .comparison-status, .comparison-note { grid-column: 2; margin-top: 0; } }
      @media (max-width: 880px) { .comparison-card { grid-template-columns: 130px minmax(0, 1fr) 30px minmax(0, 1fr); gap: 8px; } .comparison-arrow { width: 25px; } }
      @media (max-width: 640px) { .comparison-shell { width: min(100% - 20px, 520px); padding-top: 10px; } .comparison-head { align-items: flex-start; flex-direction: column; border-radius: 15px; } .comparison-card { grid-template-columns: 1fr; gap: 8px; padding: 11px; } .comparison-name { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 10px; padding: 1px 3px; } .comparison-number { grid-row: 1/3; margin: 0; } .comparison-name small { grid-column: 2; margin: -5px 0 0; } .comparison-arrow { margin: 2px auto; transform: rotate(90deg); } }
    </style>
  </head>
  <body>
    <main class="comparison-shell">
      <header class="comparison-head">
        <div><h1>현재 ↔ 새 썸네일 비교</h1><p id="comparison-description">선택한 34개만 장면형 시안으로 제작했습니다.</p></div>
        <span class="comparison-total" id="comparison-total">34개 비교</span>
      </header>
      <nav class="comparison-nav" aria-label="썸네일 검토 범위">
        <a href="./thumbnail-review-comparison.html">승인 전체 34개</a><a href="?focus=4,5,6,10,11,16,17,36">마지막 수정 8개</a><a href="./index.html#tools">적용된 사이트</a><a href="./thumbnail-review-current.html">원본 81개</a>
      </nav>
      <section class="comparison-list" id="comparison-list"><p class="comparison-loading">비교판을 불러오고 있습니다.</p></section>
    </main>
    <script src="./assets/thumbnail-candidates.js?v=20260903-5"></script>
    <script src="./assets/tool-thumbnails.js?v=20260903-5"></script>
    <script>
      (async () => {
        const response = await fetch("./assets/thumbnails/legacy/catalog.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const source = await response.text();
        const parsed = new DOMParser().parseFromString(source, "text/html");
        const allCards = [...parsed.querySelectorAll(".tool-card[data-tool-id]")];
        const cardById = new Map(allCards.map((card, index) => [card.dataset.toolId, { card, number: index + 1 }]));
        const params = new URLSearchParams(location.search);
        const approved = new Set(window.MATH_TOOL_THUMBNAILS.redesigned);
        const focusNumbers = new Set((params.get("focus") || "").split(",").map(Number).filter(n => Number.isInteger(n) && n > 0));
        let reviewOrder = focusNumbers.size
          ? window.THUMBNAIL_CANDIDATES.order.filter((toolId) => focusNumbers.has(cardById.get(toolId)?.number))
          : window.THUMBNAIL_CANDIDATES.order;
        if (params.get("status") === "approved") reviewOrder = reviewOrder.filter(id => approved.has(id));
        if (params.get("status") === "pending") reviewOrder = reviewOrder.filter(id => !approved.has(id));
        document.querySelector("#comparison-total").textContent = `${reviewOrder.length}개 비교`;
        document.querySelector("#comparison-description").textContent = focusNumbers.size
          ? "선택한 번호의 원본과 최신 시안입니다."
          : "승인된 34개를 로컬에 적용했습니다. 선택하지 않은 47개는 그대로입니다.";
        const list = document.querySelector("#comparison-list");
        list.replaceChildren();

        reviewOrder.forEach((toolId) => {
          const entry = cardById.get(toolId);
          if (!entry) return;
          const { card: sourceCard, number } = entry;
          const comparison = document.createElement("article");
          comparison.className = "comparison-card";
          comparison.dataset.reviewNumber = number;

          const name = document.createElement("div");
          name.className = "comparison-name";
          const badge = document.createElement("span");
          badge.className = "comparison-number";
          badge.textContent = String(number).padStart(2, "0");
          const title = document.createElement("h2");
          title.textContent = sourceCard.querySelector("h3")?.textContent?.trim() || toolId;
          const slug = document.createElement("small");
          slug.textContent = toolId;
          name.append(badge, title, slug);
          const status = document.createElement("span");
          status.className = `comparison-status${approved.has(toolId) ? "" : " pending"}`;
          status.textContent = approved.has(toolId) ? "승인 · 로컬 적용" : "미승인 · 시안만 보관";
          name.append(status);
          const corrections = {
            "common2-circle": "반지름에 수직인 접선으로 보정",
            "common2-inverse": "정방향의 출력을 원래 입력으로 되돌림",
            "common2-rational": "실제 역비례 식으로 두 곡선 가지를 계산"
          };
          if (corrections[toolId]) {
            const note = document.createElement("span");
            note.className = "comparison-note";
            note.textContent = corrections[toolId];
            name.append(note);
          }

          const oldPane = document.createElement("section");
          oldPane.className = "comparison-pane old";
          oldPane.innerHTML = '<div class="pane-label">기존 · 보관본</div>';
          const oldHost = document.createElement("div");
          oldHost.className = `${sourceCard.className} preview-host`;
          const oldVisual = sourceCard.querySelector(".tool-visual")?.cloneNode(true);
          if (oldVisual) oldHost.append(oldVisual);
          oldPane.append(oldHost);

          const arrow = document.createElement("div");
          arrow.className = "comparison-arrow";
          arrow.setAttribute("aria-hidden", "true");

          const newPane = document.createElement("section");
          newPane.className = "comparison-pane new";
          newPane.innerHTML = '<div class="pane-label">새 시안</div>';
          if (window.THUMBNAIL_CANDIDATES.colorOnly.includes(toolId)) {
            const recolorHost = document.createElement("div");
            recolorHost.className = `${sourceCard.className} preview-host candidate-recolor`;
            const recoloredVisual = sourceCard.querySelector(".tool-visual")?.cloneNode(true);
            if (recoloredVisual) recolorHost.append(recoloredVisual);
            newPane.append(recolorHost);
          } else {
            const candidateVisual = document.createElement("div");
            candidateVisual.className = "candidate-visual";
            candidateVisual.innerHTML = window.THUMBNAIL_CANDIDATES.render(toolId);
            newPane.append(candidateVisual);
          }

          comparison.append(name, oldPane, arrow, newPane);
          list.append(comparison);
        });
      })().catch((error) => {
        document.querySelector("#comparison-list").innerHTML = `<p class="comparison-loading">불러오지 못했습니다: ${error.message}</p>`;
      });
    </script>
  </body>
</html>
